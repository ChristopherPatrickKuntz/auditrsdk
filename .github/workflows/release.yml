name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # `id-token: write` lets GitHub Actions mint an OIDC token that
    # npm can verify against the package's Trusted Publisher
    # configuration. No long-lived NPM_TOKEN secret needed.
    # https://docs.npmjs.com/trusted-publishers/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing requires npm >= 11.5.1; setup-node v4
      # ships an older default. Upgrade explicitly so the publish
      # step understands the OIDC flow.
      - name: Upgrade npm (Trusted Publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN; npm CLI detects the GitHub OIDC token
      # automatically. Provenance attestation is generated by default
      # when publishing under Trusted Publishing, but we pass the
      # flag explicitly so a future npm CLI change can't silently
      # drop it.
      - name: Publish (with provenance via OIDC)
        run: npm publish --provenance --access public
